<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ehsan App | Real-time Voice Translator</title>
    <meta name="description"
        content="Premium real-time voice translation between English and Finnish with zero friction.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="glass-background"></div>
    <div class="glow-sphere" id="sphere-1"></div>
    <div class="glow-sphere" id="sphere-2"></div>

    <main class="container">
        <header>
            <div class="logo">
                <span class="logo-icon">✦</span>
                <h1>Ehsan <span>App</span></h1>
            </div>
            <p class="subtitle">Real-time Finnish & English Convergence</p>
        </header>

        <section class="translator-card">
            <div class="controls">
                <div class="mode-switch">
                    <span class="lang-label" id="lang-src">English</span>
                    <label class="switch">
                        <input type="checkbox" id="direction-toggle">
                        <span class="slider round"></span>
                    </label>
                    <span class="lang-label" id="lang-dest">Finnish</span>
                </div>

                <button id="mic-btn" class="mic-button">
                    <span class="mic-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M12 1C10.3431 1 9 2.34315 9 4V12C9 13.6569 10.3431 15 12 15C13.6569 15 15 13.6569 15 12V4C15 2.34315 13.6569 1 12 1Z"
                                fill="currentColor" />
                            <path d="M19 10V12C19 15.866 15.866 19 12 19C8.13401 19 5 15.866 5 12V10"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                            <path d="M12 19V23" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                            <path d="M8 23H16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </span>
                    <div class="pulse-ring"></div>
                </button>
                <div id="status-text" class="status">Click to Start Listening</div>
            </div>

            <div class="translation-display">
                <div class="text-block original">
                    <label>Spoken Text</label>
                    <div id="input-text" class="content-area">...</div>
                </div>
                <div class="divider">
                    <div class="line"></div>
                    <div class="arrow">↓</div>
                    <div class="line"></div>
                </div>
                <div class="text-block translated">
                    <label>Translation</label>
                    <div id="output-text" class="content-area">...</div>
                </div>
            </div>
        </section>

        <footer>
            <p>&copy; 2026 Flux AI. Powered by Web Speech Engine.</p>
        </footer>
    </main>

    <script src="app.js"></script>
</body>

</html>
